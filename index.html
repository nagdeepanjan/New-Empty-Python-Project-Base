<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10102d">
  <title>Hello World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10102d;
      color: white;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(125deg, #11102e, #281254, #113859, #11102e);
      background-size: 300% 300%;
      animation: aurora 16s ease infinite;
    }

    body::before, body::after {
      position: absolute;
      z-index: -1;
      width: min(72vw, 680px);
      aspect-ratio: 1;
      border-radius: 50%;
      content: "";
      filter: blur(85px);
      opacity: .42;
      animation: drift 12s ease-in-out infinite alternate;
    }

    body::before { background: #fa48c4; top: -38%; left: -18%; }
    body::after { background: #27d9ff; bottom: -48%; right: -18%; animation-delay: -6s; }

    canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main { padding: 2rem; text-align: center; }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -.075em;
      background: linear-gradient(90deg, #ff84dc, #ffd66b, #7cf6e7, #a99bff, #ff84dc);
      background-size: 250% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 32px #e963de55);
      animation: shimmer 6s linear infinite, greet 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    p {
      margin: 1.35rem 0 0;
      color: #e2ddff;
      font-size: clamp(.9rem, 2vw, 1.1rem);
      letter-spacing: .28em;
      text-transform: uppercase;
      animation: fade-in 1s 350ms both;
    }

    @keyframes aurora { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes drift { to { transform: translate(15vw, 12vh) scale(1.18); } }
    @keyframes shimmer { to { background-position: 250% center; } }
    @keyframes greet { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: .85; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>
  <main>
    <h1>Hello World!</h1>
    <p>A little color for your day</p>
  </main>
  <script>
    const canvas = document.querySelector("canvas");
    const context = canvas.getContext("2d");
    const colors = ["#ff83dc", "#ffd66b", "#7cf6e7", "#a99bff"];
    let particles = [];
    let width = 0;
    let height = 0;
    let frame;

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      particles = Array.from({ length: Math.min(65, Math.floor(width / 20)) }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 1,
        speed: Math.random() * .35 + .12,
        phase: Math.random() * Math.PI * 2,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));
    }

    function animate(time = 0) {
      context.clearRect(0, 0, width, height);
      particles.forEach((particle) => {
        const pulse = .35 + (Math.sin(time * .001 + particle.phase) + 1) * .3;
        context.globalAlpha = pulse;
        context.fillStyle = particle.color;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        context.fill();
        particle.y -= particle.speed;
        if (particle.y < -4) particle.y = height + 4;
      });
      context.globalAlpha = 1;
      frame = requestAnimationFrame(animate);
    }

    resize();
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) animate();
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
